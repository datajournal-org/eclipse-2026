<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2 — Schattenlauf (Prototyp)</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script type="importmap">
{ "imports": { "astronomy-engine": "https://esm.sh/astronomy-engine@2.1.19" } }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; color: #e9e6df;
    font: 14px/1.5 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 5;
    background: rgba(10,14,22,.82); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 12px 14px;
    max-width: 640px; margin: 0 auto; }
  .row { display: flex; align-items: center; gap: 12px; }
  .clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.15rem; }
  .clock small { font-weight: 400; opacity: .6; }
  input[type=range] { flex: 1; accent-color: #e8a33d; }
  .meta { font-variant-numeric: tabular-nums; opacity: .8; font-size: .82rem; margin-top: 6px; }
  .title { position: absolute; top: 12px; left: 12px; z-index: 5; font-weight: 700;
    text-shadow: 0 1px 4px #000; }
  .title small { display:block; font-weight: 400; opacity: .7; }
  .legend { display:flex; gap:14px; align-items:center; margin-top:8px; font-size:.8rem; opacity:.85; }
  .legend span { display:flex; align-items:center; gap:6px; }
  .legend i { width:22px; height:0; border-top:2px dashed currentColor; display:inline-block; }
</style>
</head>
<body>
<div id="map"></div>
<div class="title">☀︎ Schattenlauf · 12. Aug 2026 <small>Prototyp A2 — Tag/Nacht &amp; Mondschatten (Umbra + Penumbra) pro Pixel, gestrichelte Iso-Bedeckungslinien.</small></div>
<div class="panel">
  <div class="row">
    <div class="clock" id="clock">--:--<small> UTC</small></div>
    <input type="range" id="slider" min="0" max="1" step="1" value="0">
  </div>
  <div class="meta" id="meta">…</div>
  <div class="legend">
    <span style="color:#e8a33d"><i></i>100 % (Totalität)</span>
    <span style="color:#f0b24a"><i></i>50 %</span>
    <span style="color:#f0d9a8"><i></i>0 % (Rand)</span>
    <span style="opacity:.6">Bedeckung</span>
  </div>
</div>

<script type="module">
import { shadowCenter, sunMoonECEF } from './eclipse.mjs';

const SAT = 'https://tiles.versatiles.org/tiles/satellite/{z}/{x}/{y}';

// central line of totality (100% obscuration) — start at 17:30 UTC: before that the umbra sits
// on the polar cap, where MapLibre's globe line rendering breaks up.
const t0 = Date.UTC(2026,7,12,17,30), t1 = Date.UTC(2026,7,12,19,0), STEP = 30*1000;
const samples = [];
for (let t=t0; t<=t1; t+=STEP){ const p=shadowCenter(new Date(t)); if(p) samples.push({t, ...p}); }
const pathCoords = samples.map(s => [s.lon, s.lat]);
const tMin = samples[0].t, tMax = samples[samples.length-1].t;
const fmt = t => new Date(t).toISOString().slice(11,16);

// ---- iso-coverage reference lines: max obscuration ever experienced at each ground point ----
// Mirror of the shader's disc-overlap, sampled on a lat/lon grid over the whole penumbral window,
// then marching-squares contours at 50% and (just above) 0% coverage.
function discOverlap(rS,rM,d){ if(d>=rS+rM)return 0; if(d<=Math.abs(rM-rS))return rM>=rS?1:(rM*rM)/(rS*rS);
  const a=Math.max(-1,Math.min(1,(d*d+rS*rS-rM*rM)/(2*d*rS))), b=Math.max(-1,Math.min(1,(d*d+rM*rM-rS*rS)/(2*d*rM)));
  const A=rS*rS*Math.acos(a)+rM*rM*Math.acos(b)-0.5*Math.sqrt(Math.max(0,(-d+rS+rM)*(d+rS-rM)*(d-rS+rM)*(d+rS+rM)));
  return A/(Math.PI*rS*rS); }
function obscAt(clat,slat,clon,slon,sm){                 // surface point from pre-split lat/lon trig
  const Px=clat*clon, Py=clat*slon, Pz=slat, su=sm.sun;
  if(Px*su[0]+Py*su[1]+Pz*su[2] <= 0) return 0;          // Sun below horizon → eclipse not seen here
  const mx=sm.moon[0]-Px, my=sm.moon[1]-Py, mz=sm.moon[2]-Pz, md=Math.hypot(mx,my,mz);
  const dot=(su[0]*mx+su[1]*my+su[2]*mz)/md;
  return discOverlap(sm.sunAngR, 0.27271/md, Math.acos(Math.max(-1,Math.min(1,dot)))); }
const D2R = Math.PI/180;
const lats=[], lons=[];
for(let la=20; la<=90+1e-9; la+=1) lats.push(la);
for(let lo=-150; lo<=100+1e-9; lo+=1) lons.push(lo);
const smSamples=[];                                       // Sun/Moon over a window wide enough for the full penumbra
for(let t=Date.UTC(2026,7,12,16,30); t<=Date.UTC(2026,7,12,19,30); t+=120*1000) smSamples.push(sunMoonECEF(new Date(t)));
const obGrid = lats.map(la=>{ const clat=Math.cos(la*D2R), slat=Math.sin(la*D2R);
  return lons.map(lo=>{ const clon=Math.cos(lo*D2R), slon=Math.sin(lo*D2R); let mx=0;
    for(const sm of smSamples){ const o=obscAt(clat,slat,clon,slon,sm); if(o>mx)mx=o; } return mx; }); });
function isoContour(level){ const segs=[];
  for(let i=0;i<lats.length-1;i++) for(let j=0;j<lons.length-1;j++){
    const v00=obGrid[i][j], v01=obGrid[i][j+1], v11=obGrid[i+1][j+1], v10=obGrid[i+1][j];
    const la0=lats[i], la1=lats[i+1], lo0=lons[j], lo1=lons[j+1], cr=[];
    const ip=(va,vb,pa,pb)=>{ const t=(level-va)/(vb-va); return [pa[0]+(pb[0]-pa[0])*t, pa[1]+(pb[1]-pa[1])*t]; };
    if((v00>level)!==(v01>level)) cr.push(ip(v00,v01,[lo0,la0],[lo1,la0]));   // top
    if((v01>level)!==(v11>level)) cr.push(ip(v01,v11,[lo1,la0],[lo1,la1]));   // right
    if((v11>level)!==(v10>level)) cr.push(ip(v11,v10,[lo1,la1],[lo0,la1]));   // bottom
    if((v10>level)!==(v00>level)) cr.push(ip(v10,v00,[lo0,la1],[lo0,la0]));   // left
    if(cr.length===2) segs.push([cr[0],cr[1]]);
    else if(cr.length===4){ segs.push([cr[0],cr[1]]); segs.push([cr[2],cr[3]]); } }
  return { type:'Feature', geometry:{ type:'MultiLineString', coordinates:segs } }; }
const iso50 = isoContour(0.5), iso0 = isoContour(0.02);

function compile(gl, vs, fs){
  const c=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(sh);return sh;};
  const p=gl.createProgram(); gl.attachShader(p,c(gl.VERTEX_SHADER,vs)); gl.attachShader(p,c(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw gl.getProgramInfoLog(p); return p;
}

// ---- per-pixel moon shadow, drawn onto the globe via MapLibre's own projection ----
// shared state (Sun/Moon in Earth-fixed frame), updated from the time slider
const shadow = { sun:[0,0,1], moon:[60,0,0], sunAngR:0.00465, ready:false };
const GRID = 200;
// fragment shader: per surface point, obscuration = overlap of Sun & Moon discs → darken
const FRAG = `#version 300 es
precision highp float; in vec3 v_ecef;
uniform vec3 u_sun; uniform vec3 u_moon; uniform float u_sunAngR;
out vec4 fragColor;
float ov(float rS,float rM,float d){ if(d>=rS+rM)return 0.0; if(d<=abs(rM-rS))return rM>=rS?1.0:(rM*rM)/(rS*rS);
  float a=clamp((d*d+rS*rS-rM*rM)/(2.0*d*rS),-1.,1.), b=clamp((d*d+rM*rM-rS*rS)/(2.0*d*rM),-1.,1.);
  float A=rS*rS*acos(a)+rM*rM*acos(b)-0.5*sqrt(max(0.,(-d+rS+rM)*(d+rS-rM)*(d-rS+rM)*(d+rS+rM)));
  return A/(3.141592653*rS*rS); }
void main(){ vec3 P=normalize(v_ecef);
  float s=dot(P,u_sun);                             // sin(solar elevation)
  float dayness=smoothstep(-0.18, 0.10, s);         // soft terminator across the twilight band
  vec3 mv=u_moon-P; float mR=0.27271/length(mv);    // Moon radius (Earth radii) / distance to P
  float sep=acos(clamp(dot(u_sun,normalize(mv)),-1.,1.));
  float o=ov(u_sunAngR,mR,sep);                     // fraction of the Sun's disc the Moon covers
  float ecl=1.0 - o*0.97;                           // from space, ground brightness ≈ 1 − obscuration
  float bright = mix(0.09, 1.0, dayness) * mix(1.0, ecl, dayness); // dark night · bright day · shadow on day
  float a = clamp(1.0 - bright, 0.0, 0.92);         // overlay opacity to reach that brightness over the satellite
  if(a < 0.004) discard;                            // bright, uneclipsed day: leave the tiles untouched
  vec3 night = vec3(0.015,0.03,0.07);               // deep-blue night tint
  vec3 umbra = vec3(0.0,0.005,0.02);                // near-black core of totality
  vec3 col = mix(night, umbra, smoothstep(0.45,1.0,o)*dayness);
  fragColor = vec4(col, a); }`;

const shadowLayer = {
  id:'moon-shadow', type:'custom', renderingMode:'2d',
  onAdd(map, gl){
    const pos=[], raw=[], idx=[], G1=GRID+1;
    for(let iy=0;iy<=GRID;iy++) for(let ix=0;ix<=GRID;ix++){ pos.push(ix/GRID, iy/GRID); raw.push(0,0); }
    for(let iy=0;iy<GRID;iy++) for(let ix=0;ix<GRID;ix++){ const a=iy*G1+ix,b=a+1,c=a+G1,d=c+1; idx.push(a,c,b, b,c,d); }
    // pole caps: Mercator only reaches ±85° — fill 85°→90° with a fan to a pole vertex,
    // placed exactly on the pole via projectTile's rawPos sentinel (see prelude projectToSphere).
    const np=pos.length/2; pos.push(0.5,0.0); raw.push(0,-40000);   // north pole
    const sp=pos.length/2; pos.push(0.5,1.0); raw.push(0, 40000);   // south pole
    const bb=GRID*G1;                                              // bottom row start
    for(let ix=0;ix<GRID;ix++) idx.push(np, ix, ix+1);             // north fan (top row iy=0)
    for(let ix=0;ix<GRID;ix++) idx.push(bb+ix, sp, bb+ix+1);       // south fan (bottom row iy=GRID)
    this.count=idx.length;
    const buf=d=>{ const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(d),gl.STATIC_DRAW); return b; };
    this.vbo=buf(pos); this.rbo=buf(raw);
    this.ibo=gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,this.ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(idx),gl.STATIC_DRAW);
    this.progs={};
  },
  // compile per projection variant (globe/mercator/transition) — MapLibre's prelude provides projectTile()
  prog(gl, sd){
    if(this.progs[sd.variantName]) return this.progs[sd.variantName];
    const vs = `#version 300 es\n`+sd.vertexShaderPrelude+`\n`+sd.define+`\n`+
      `in vec2 a_pos; in vec2 a_raw; out vec3 v_ecef;
       void main(){ gl_Position=projectTile(a_pos, a_raw);          // 2-arg: rawPos sentinel → pole
         if(a_raw.y < -32767.5){ v_ecef=vec3(0.0,0.0,1.0); }        // north pole (frame: z=north)
         else if(a_raw.y > 32766.5){ v_ecef=vec3(0.0,0.0,-1.0); }   // south pole
         else { float lon=a_pos.x*6.283185307-3.141592653;          // mercator 0..1 → lon/lat
           float lat=atan(sinh(3.141592653*(1.0-2.0*a_pos.y)));
           float cl=cos(lat); v_ecef=vec3(cl*cos(lon), cl*sin(lon), sin(lat)); } }`;
    const p=compile(gl, vs, FRAG); const L=n=>gl.getUniformLocation(p,n);
    return this.progs[sd.variantName]={ p, a:gl.getAttribLocation(p,'a_pos'), ar:gl.getAttribLocation(p,'a_raw'),
      pm:L('u_projection_matrix'), tmc:L('u_projection_tile_mercator_coords'),
      cp:L('u_projection_clipping_plane'), tr:L('u_projection_transition'), fm:L('u_projection_fallback_matrix'),
      sun:L('u_sun'), moon:L('u_moon'), sar:L('u_sunAngR') };
  },
  render(gl, opt){
    if(!shadow.ready) return;
    const o=this.prog(gl, opt.shaderData), pd=opt.defaultProjectionData;
    gl.useProgram(o.p);
    if(o.pm) gl.uniformMatrix4fv(o.pm,false,pd.mainMatrix);            // MapLibre projection uniforms
    if(o.tmc&&pd.tileMercatorCoords) gl.uniform4fv(o.tmc,pd.tileMercatorCoords);
    if(o.cp&&pd.clippingPlane) gl.uniform4fv(o.cp,pd.clippingPlane);
    if(o.tr!=null&&pd.projectionTransition!=null) gl.uniform1f(o.tr,pd.projectionTransition);
    if(o.fm&&pd.fallbackMatrix) gl.uniformMatrix4fv(o.fm,false,pd.fallbackMatrix);
    gl.uniform3fv(o.sun,shadow.sun); gl.uniform3fv(o.moon,shadow.moon); gl.uniform1f(o.sar,shadow.sunAngR);
    gl.bindBuffer(gl.ARRAY_BUFFER,this.vbo); gl.enableVertexAttribArray(o.a); gl.vertexAttribPointer(o.a,2,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,this.rbo); gl.enableVertexAttribArray(o.ar); gl.vertexAttribPointer(o.ar,2,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,this.ibo);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK); gl.disable(gl.DEPTH_TEST);   // near hemisphere only
    gl.drawElements(gl.TRIANGLES,this.count,gl.UNSIGNED_INT,0);
    gl.disable(gl.CULL_FACE);
  },
};

const Q = new URLSearchParams(location.search);
const camLat = Q.has('lat') ? +Q.get('lat') : 58;
const camLon = Q.has('lon') ? +Q.get('lon') : -18;
const camZoom = Q.has('zoom') ? +Q.get('zoom') : 2.2;
const map = new maplibregl.Map({
  container:'map', center:[camLon,camLat], zoom:camZoom,
  style:{ version:8,
    sources:{ sat:{ type:'raster', tiles:[SAT], tileSize:256, maxzoom:19, attribution:'© VersaTiles / Mapterhorn' } },
    layers:[ { id:'bg', type:'background', paint:{'background-color':'#05070d'} },
             { id:'sat', type:'raster', source:'sat', paint:{'raster-brightness-max':.9} } ] },
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch:true }));
window.map = map;

map.on('load', () => {
  map.setProjection({ type:'globe' });
  map.addLayer(shadowLayer);                                  // day/night + eclipse darkening, under the lines
  map.addSource('iso0', { type:'geojson', data:iso0 });
  map.addLayer({ id:'iso0', type:'line', source:'iso0',
    paint:{ 'line-color':'#f0d9a8', 'line-width':1, 'line-dasharray':[1,3], 'line-opacity':.5 } });   // 0% edge
  map.addSource('iso50', { type:'geojson', data:iso50 });
  map.addLayer({ id:'iso50', type:'line', source:'iso50',
    paint:{ 'line-color':'#f0b24a', 'line-width':1.3, 'line-dasharray':[3,3], 'line-opacity':.75 } }); // 50%
  map.addSource('path', { type:'geojson', data:{ type:'Feature', geometry:{ type:'LineString', coordinates:pathCoords } } });
  map.addLayer({ id:'path', type:'line', source:'path',
    paint:{ 'line-color':'#e8a33d', 'line-width':2, 'line-dasharray':[2,2], 'line-opacity':.95 } });   // 100% totality

  const slider = document.getElementById('slider');
  slider.min=0; slider.max=samples.length-1; slider.value=Math.floor(samples.length/2);
  function update(){
    const s=samples[+slider.value], date=new Date(s.t);
    const sm=sunMoonECEF(date); shadow.sun=sm.sun; shadow.moon=sm.moon; shadow.sunAngR=sm.sunAngR; shadow.ready=true;
    map.triggerRepaint();
    const p=shadowCenter(date);
    document.getElementById('clock').innerHTML=`${fmt(s.t)}<small> UTC</small>`;
    document.getElementById('meta').textContent=
      `Kernschatten @ ${p.lat.toFixed(2)}°, ${p.lon.toFixed(2)}°  ·  Umbra + Penumbra pro Pixel  ·  Pfad ${fmt(tMin)}–${fmt(tMax)} UTC`;
  }
  slider.addEventListener('input', update);
  update();
});
</script>
</body>
</html>
