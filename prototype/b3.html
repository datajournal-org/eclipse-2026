<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B3 — 3D-Horizont + Sonne (Prototyp)</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script type="importmap">
{ "imports": {
  "astronomy-engine": "https://esm.sh/astronomy-engine@2.1.19",
  "@versatiles/style": "https://esm.sh/@versatiles/style@5.13.0"
} }
</script>
<style>
  html, body { margin:0; height:100%; background:#0a0d14; color:#eae7df;
    font:14px/1.5 system-ui, sans-serif; }
  #map { position:absolute; inset:0; }
  .panel { position:absolute; left:12px; right:12px; bottom:12px; z-index:5;
    background:rgba(10,14,22,.82); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:12px 14px;
    max-width:640px; margin:0 auto; }
  .row { display:flex; align-items:center; gap:12px; }
  .clock { font-variant-numeric:tabular-nums; font-weight:700; font-size:1.1rem; white-space:nowrap; }
  .clock small { font-weight:400; opacity:.6; }
  input[type=range] { flex:1; accent-color:#e8a33d; }
  .chips { display:flex; gap:14px; margin-top:8px; font-variant-numeric:tabular-nums; font-size:.86rem; }
  .chips b { color:#e8a33d; }
  .title { position:absolute; top:12px; left:12px; z-index:5; font-weight:700; text-shadow:0 1px 4px #000; }
  .title small { display:block; font-weight:400; opacity:.75; max-width:60ch; }
  .warn { color:#ffcf9a; }
</style>
</head>
<body>
<div id="map"></div>
<div class="title">☀︎ Deine Sicht nach Westen · 12. Aug 2026 <small>Prototyp B3 — Ego-Blick Richtung Sonne. Berge/Gebäude aus VersaTiles; Sonne mit geometrisch orientierter Sichel. Ort via <code>?lat=&amp;lon=</code>.</small></div>
<div class="panel">
  <div class="row">
    <div class="clock" id="clock">--:--<small> UTC</small></div>
    <input type="range" id="slider" min="0" max="1" step="1" value="0">
  </div>
  <div class="chips">
    <span>☀ Höhe <b id="alt">–</b></span>
    <span>Azimut <b id="az">–</b></span>
    <span>◐ Bedeckung <b id="obsc">–</b></span>
    <span id="note" class="warn"></span>
  </div>
  <div id="dbg" style="margin-top:6px;font-size:.74rem;opacity:.72;font-variant-numeric:tabular-nums"></div>
</div>

<script type="module">
import { sunMoonHorizon, localCircumstances } from './eclipse.mjs';
import { colorful } from '@versatiles/style';

const ELEV = 'https://tiles.versatiles.org/tiles/elevation/{z}/{x}/{y}';

const q = new URLSearchParams(location.search);
const LAT = parseFloat(q.get('lat')) || 52.520;   // default: Berlin
const LON = parseFloat(q.get('lon')) || 13.405;
const D2R = Math.PI/180, R2D = 180/Math.PI;
const AU = 149597870.7, RSUN = 696000, RMOON = 1737.4;

// Eclipse time window at this observer
const lc = localCircumstances(LAT, LON);
const tStart = (lc?.partialBegin?.time ?? new Date('2026-08-12T16:30:00Z')).getTime();
const tEnd   = (lc?.partialEnd?.time   ?? new Date('2026-08-12T19:00:00Z')).getTime();
const N = 240, times = Array.from({length:N+1}, (_,i)=> tStart + (tEnd-tStart)*i/N);

const norm180 = d => ((d+540)%360)-180;
function destPoint(lat, lon, brgDeg, distM) {
  const R=6371000, d=distM/R, br=brgDeg*D2R, la=lat*D2R, lo=lon*D2R;
  const la2=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(br));
  const lo2=lo+Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(la), Math.cos(d)-Math.sin(la)*Math.sin(la2));
  return [lo2*R2D, la2*R2D];
}

// ---- shared render state, written by update(), read by the custom sun layer ----
const sun = { center:[0,0,0,1], moon:[0,0], moonR:1, visible:false, opacity:1 };
const SUN_PX = 46;              // on-screen radius (px) — enlarged for legibility
const SUN_DIST = 30000;         // metres: far enough that buildings (<1 km) occlude it

// Stylized OSM vector base (VersaTiles "colorful") + terrain DEM.
// baseUrl is required in the browser: colorful() otherwise resolves tile/sprite/glyph
// URLs against location.origin (for self-hosting) → 404 on our dev server.
const style = colorful({ baseUrl: 'https://tiles.versatiles.org' });
style.sources.dem = { type:'raster-dem', tiles:[ELEV], tileSize:256, maxzoom:12, encoding:'terrarium' };

const map = new maplibregl.Map({
  container:'map', center:[LON,LAT], zoom:16, pitch:85, bearing:290, maxPitch:85,
  style,
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch:true }));
window.map = map; // for debugging / headless introspection

// surface style/tile errors on-page (diagnostic)
map.on('error', (e) => {
  const msg = (e && e.error && e.error.message) ? e.error.message : String((e && e.error) || e);
  (window.__errors = window.__errors || []).push({
    message: e?.error?.message, sourceId: e?.sourceId,
    url: e?.error?.url, status: e?.error?.status, name: e?.error?.name,
  });
  const el = document.getElementById('dbg');
  if (el) el.innerHTML = '<span style="color:#ff9a9a">Fehler: ' + msg + '</span>';
  console.error('map error:', e?.sourceId || '', msg);
});

// ---------------- custom WebGL sun layer ----------------
function compile(gl, vs, fs) {
  const c=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(sh);return sh;};
  const p=gl.createProgram();
  gl.attachShader(p,c(gl.VERTEX_SHADER,vs));gl.attachShader(p,c(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw gl.getProgramInfoLog(p);
  return p;
}
const sunLayer = {
  id:'sun', type:'custom', renderingMode:'3d',
  onAdd(_m, gl) {
    this.prog = compile(gl, `
      attribute vec2 a_corner;
      uniform mat4 u_matrix; uniform vec4 u_center; uniform vec2 u_pix;
      varying vec2 v_uv;
      void main(){ vec4 clip=u_matrix*u_center;
        // keep the far-away sun just inside the far plane so it is never depth-clipped,
        // while still sitting behind nearer buildings for the depth test
        clip.z=min(clip.z, clip.w*0.9999);
        gl_Position=clip+vec4(a_corner*u_pix*clip.w,0.0,0.0); v_uv=a_corner; }`, `
      precision highp float; varying vec2 v_uv;
      uniform vec2 u_moon; uniform float u_moonR; uniform float u_opacity;
      void main(){
        float rs=length(v_uv); if(rs>1.0) discard;
        float rm=length(v_uv-u_moon);
        float moon=smoothstep(u_moonR-0.03,u_moonR+0.01,rm); // 0 inside moon,1 outside
        float limb=smoothstep(1.0,0.90,rs);
        float a=moon*limb*u_opacity; if(a<0.01) discard;
        gl_FragColor=vec4(1.0,0.93,0.72,a);
      }`);
    this.a=gl.getAttribLocation(this.prog,'a_corner');
    this.uMatrix=gl.getUniformLocation(this.prog,'u_matrix');
    this.uCenter=gl.getUniformLocation(this.prog,'u_center');
    this.uPix=gl.getUniformLocation(this.prog,'u_pix');
    this.uMoon=gl.getUniformLocation(this.prog,'u_moon');
    this.uMoonR=gl.getUniformLocation(this.prog,'u_moonR');
    this.uOpacity=gl.getUniformLocation(this.prog,'u_opacity');
    this.buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,this.buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 1,-1, -1,1, 1,1]),gl.STATIC_DRAW);
  },
  render(gl, arg) {
    if(!sun.visible || sun.opacity <= 0.01) return;
    const matrix = Array.isArray(arg) ? arg : arg.defaultProjectionData.mainMatrix;
    gl.useProgram(this.prog);
    gl.bindBuffer(gl.ARRAY_BUFFER,this.buf);
    gl.enableVertexAttribArray(this.a);
    gl.vertexAttribPointer(this.a,2,gl.FLOAT,false,0,0);
    gl.uniformMatrix4fv(this.uMatrix,false,matrix);
    gl.uniform4fv(this.uCenter,sun.center);
    gl.uniform2f(this.uPix, SUN_PX*2/gl.drawingBufferWidth, SUN_PX*2/gl.drawingBufferHeight);
    gl.uniform2f(this.uMoon, sun.moon[0], sun.moon[1]);
    gl.uniform1f(this.uMoonR, sun.moonR);
    gl.uniform1f(this.uOpacity, sun.opacity);
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(false);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  },
};

map.on('load', () => {
  map.setTerrain({ source:'dem', exaggeration:1.0 });
  try { map.setSky({ 'sky-color':'#8fb4e0', 'horizon-color':'#f4c48a',
    'fog-color':'#e6c39a', 'sky-horizon-blend':0.7, 'horizon-fog-blend':0.6 }); } catch(e){}

  const firstSymbol = map.getStyle().layers.find(l => l.type === 'symbol')?.id;
  // subtle terrain shading beneath labels
  map.addLayer({ id:'hillshade', type:'hillshade', source:'dem',
    paint:{ 'hillshade-exaggeration':0.35 } }, firstSymbol);
  // replace the colorful theme's flat building fills with real 3D extrusions
  for (const id of ['building', 'building:outline']) if (map.getLayer(id)) map.removeLayer(id);
  map.addLayer({ id:'buildings-3d', type:'fill-extrusion', source:'versatiles-shortbread',
    'source-layer':'buildings', filter:['!=', ['get','hide_3d'], true],
    paint:{
      'fill-extrusion-color':'#d7c9b6',
      'fill-extrusion-height':['coalesce', ['get','height'], 3],
      'fill-extrusion-base':['coalesce', ['get','min_height'], 0],
      'fill-extrusion-opacity':0.96,
    } }, firstSymbol);

  map.addLayer(sunLayer);

  const slider = document.getElementById('slider');
  slider.min = 0; slider.max = N;
  // start at greatest eclipse
  const peakT = (lc?.peak?.time ?? new Date('2026-08-12T18:08:00Z')).getTime();
  slider.value = Math.round((peakT - tStart)/(tEnd - tStart)*N);

  const fmt = t => new Date(t).toISOString().slice(11,16);
  const EYE = 1.7, CAM_TGT = 3000;

  // max elevation angle of the terrain along an azimuth (incl. Earth-curvature dip)
  function terrainHorizonAlt(az, eyeAlt) {
    let maxAng = -90;
    for (const d of [150, 300, 600, 1200, 2500, 5000, 10000, 20000, 40000]) {
      const [lng2, lat2] = destPoint(LAT, LON, az, d);
      const e = map.queryTerrainElevation([lng2, lat2]);
      if (e == null) continue;
      const drop = d*d / (2 * 6371000);                 // horizon dip from curvature
      const ang = Math.atan2((e - drop) - eyeAlt, d) * R2D;
      if (ang > maxAng) maxAng = ang;
    }
    return maxAng;
  }

  function update() {
    const t = times[+slider.value], date = new Date(t);
    const sm = sunMoonHorizon(LAT, LON, date);
    const s = sm.sun, m = sm.moon;
    const sunAngR  = Math.atan(RSUN /(s.distAu*AU))*R2D;
    const moonAngR = Math.atan(RMOON/(m.distAu*AU))*R2D;
    // moon centre offset relative to sun, in sun-radius units (screen: +x=right/east, +y=up)
    const dx = norm180(m.az - s.az) * Math.cos(s.alt*D2R);
    const dy = (m.alt - s.alt);
    sun.moon = [dx/sunAngR, dy/sunAngR];
    sun.moonR = moonAngR/sunAngR;

    const ground = map.queryTerrainElevation([LON, LAT]) ?? 0;
    const eyeAlt = ground + EYE;

    // place the sun disk along (az, alt), far enough that buildings occlude it
    const hd = SUN_DIST*Math.cos(s.alt*D2R), vd = SUN_DIST*Math.sin(s.alt*D2R);
    const [slng, slat] = destPoint(LAT, LON, s.az, hd);
    const merc = maplibregl.MercatorCoordinate.fromLngLat([slng, slat], eyeAlt + vd);
    sun.center = [merc.x, merc.y, merc.z, 1];

    // terrain occlusion: fade the sun out as it drops below the terrain/curvature horizon
    const horizon = terrainHorizonAlt(s.az, eyeAlt);
    sun.opacity = Math.min(1, Math.max(0, (s.alt - horizon + 0.25) / 0.5));
    sun.visible = sun.opacity > 0.01;

    // eye-level first-person camera: from the observer's eye toward the sun
    try {
      const tgtAlt = eyeAlt + CAM_TGT*Math.tan(s.alt*D2R);
      const [tlng, tlat] = destPoint(LAT, LON, s.az, CAM_TGT);
      map.jumpTo(map.calculateCameraOptionsFromTo([LON, LAT], eyeAlt, [tlng, tlat], tgtAlt));
    } catch (e) { map.setBearing(s.az); }

    const obsc = discOverlapFraction(sunAngR, moonAngR, Math.hypot(dx, dy));
    document.getElementById('clock').innerHTML = `${fmt(t)}<small> UTC</small>`;
    document.getElementById('alt').textContent = s.alt.toFixed(1)+'°';
    document.getElementById('az').textContent  = s.az.toFixed(0)+'°';
    document.getElementById('obsc').textContent = (obsc*100).toFixed(0)+'%';
    document.getElementById('note').textContent = s.alt <= horizon ? 'Sonne hinter Horizont/Gelände' : '';
    document.getElementById('dbg').textContent =
      `Boden ${ground.toFixed(0)} m · Gelände-Horizont ${horizon.toFixed(1)}° · ` +
      `OSM-Kacheln geladen: ${map.isSourceLoaded('versatiles-shortbread') ? 'ja' : '…'}`;
    map.triggerRepaint();
  }
  slider.addEventListener('input', update);
  // recompute after terrain tiles have loaded (queryTerrainElevation needs them)
  map.once('idle', update);
  update();
});

// fraction of the SUN disk area covered by the MOON disk (both as circles on the sky)
function discOverlapFraction(rS, rM, d) {
  if (d >= rS + rM) return 0;
  if (d <= Math.abs(rM - rS)) return rM >= rS ? 1 : (rM*rM)/(rS*rS);
  const a = (d*d + rS*rS - rM*rM)/(2*d*rS), b = (d*d + rM*rM - rS*rS)/(2*d*rM);
  const A = rS*rS*Math.acos(Math.min(1,Math.max(-1,a)))
          + rM*rM*Math.acos(Math.min(1,Math.max(-1,b)))
          - 0.5*Math.sqrt(Math.max(0,(-d+rS+rM)*(d+rS-rM)*(d-rS+rM)*(d+rS+rM)));
  return A/(Math.PI*rS*rS);
}
</script>
</body>
</html>
