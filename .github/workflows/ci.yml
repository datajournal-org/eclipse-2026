name: CI

on:
   push:
      branches: [main]
   pull_request:
   workflow_dispatch:

# Pages deployment needs these; nothing else in the workflow writes to the repo.
permissions:
   contents: read
   pages: write
   id-token: write

# A newer push supersedes an in-flight run, but never cancel a deployment half-way.
concurrency:
   group: ci-${{ github.ref }}
   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
   NODE_VERSION: '24'

jobs:
   # Static gate and unit tests: seconds, no browsers, no GPU. Its own job so an eslint or unit failure
   # cannot stop the end-to-end shards from reporting — which is exactly what happened when these shared
   # a job: a timezone bug in one unit test meant 226 browser tests never ran at all.
   checks:
      name: Lint, types and unit tests
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - name: Check out the repository
           uses: actions/checkout@v7

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version: ${{ env.NODE_VERSION }}
              cache: npm

         - name: Install dependencies
           run: npm ci

         # `precompute` runs `svelte-kit sync` itself, so the generated tsconfig the type checks need exists.
         - name: Generate the corridor and the eclipse-day sky
           run: npm run precompute

         - name: Check formatting (Prettier)
           run: npm run check:format

         - name: Check types (tsc)
           run: npm run check:ts

         - name: Lint (ESLint)
           run: npm run lint

         - name: Check Svelte components (svelte-check)
           run: npm run check:svelte

         - name: Unit tests (Vitest)
           run: npm run test:unit

   # Every Playwright test, sharded four ways on macOS.
   #
   # macOS because those runners expose a real GPU — verified from a run: ANGLE Metal Renderer (Apple
   # Paravirtual device). On the GPU-less Ubuntu runner the WebGL specs never finished at all: one leg
   # failed at 9m, the other was cancelled at 19m. On macOS the same specs took ~2m.
   #
   # Four plain count-based shards, rather than the cost-based split this replaces. That split existed
   # only because WebGL dominated without a GPU — measured 192s / 81s / 27s / 18s across four shards.
   # With a GPU the distortion is gone and count-based sharding balances: 29s / 33s / 23s / 20s locally.
   e2e:
      name: Browser tests ${{ matrix.shard }}/4
      runs-on: macos-latest
      timeout-minutes: 30
      strategy:
         fail-fast: false
         matrix:
            shard: [1, 2, 3, 4]

      steps:
         - name: Check out the repository
           uses: actions/checkout@v7

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version: ${{ env.NODE_VERSION }}
              cache: npm # caches ~/.npm keyed on package-lock.json

         - name: Install dependencies
           run: npm ci

         # The map tiles. One located page load pulls ~66 objects from tiles.versatiles.org; across the
         # suite that is thousands of requests for the same handful of tiles. Restoring this keeps the run
         # fast and keeps us from hammering a free community service on every push.
         #
         # Keyed per shard, since each shard needs a different subset. The key is unique per run so it
         # never hits, and restore-keys falls back to the most recent — the standard "restore the latest,
         # save an updated copy" pattern, so newly needed tiles are fetched once and folded in.
         - name: Restore the map tile cache
           uses: actions/cache@v6
           with:
              path: .cache/tiles
              key: tiles-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}
              restore-keys: |
                 tiles-${{ runner.os }}-${{ matrix.shard }}-

         - name: Generate the corridor and the eclipse-day sky
           run: npm run precompute

         # Browsers are ~400 MB and unchanged between runs; key on the Playwright version so a bump
         # invalidates it. Playwright stores them under ~/Library/Caches on macOS, not ~/.cache.
         - name: Resolve the Playwright version
           id: pw
           run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

         - name: Restore the Playwright browser cache
           uses: actions/cache@v6
           with:
              path: ~/Library/Caches/ms-playwright
              key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

         - name: Install Playwright browsers (Chromium, WebKit)
           run: npx playwright install chromium webkit

         # Records whether this runner still has a GPU. If it ever prints SwiftShader instead of Metal,
         # the timings above stop holding and the shape of this workflow needs revisiting.
         - name: Report the WebGL renderer this runner offers
           if: matrix.shard == 1
           run: |
              cat > tests/renderer-report.spec.ts <<'EOF'
              import { test } from './fixtures';
              test('renderer', async ({ page }) => {
                await page.goto('about:blank');
                const renderer = await page.evaluate(() => {
                  const gl = document.createElement('canvas').getContext('webgl2');
                  if (!gl) return 'NO WEBGL';
                  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                  return dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) : 'no debug ext';
                });
                console.log(`::notice title=WebGL::${renderer}`);
              });
              EOF
              npx playwright test tests/renderer-report.spec.ts --project chromium --reporter=list
              rm -f tests/renderer-report.spec.ts

         - name: Run Playwright tests (shard ${{ matrix.shard }} of 4)
           run: npx playwright test --shard=${{ matrix.shard }}/4
           env:
              CI: true

         - name: Upload the Playwright report
           uses: actions/upload-artifact@v7
           if: ${{ !cancelled() }}
           with:
              name: playwright-report-${{ matrix.shard }}
              path: playwright-report/
              retention-days: 7

   # The PRIMARY deployment: datajournal.org serves each project from the .tar.zst asset of its latest
   # GitHub release (the server never builds or checks out project repos). Every green main push
   # re-publishes the asset and pings the server's webhook to pick it up. The contract — exactly one
   # .tar.zst on the latest release, index.html/meta.json/preview at the archive root, no hidden files,
   # paths under ~96 chars — is pinned by tests/publish.spec.ts on every run, not just here.
   release:
      name: Release to datajournal.org
      needs: [checks, e2e]
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      runs-on: ubuntu-latest
      timeout-minutes: 15
      permissions:
         contents: write # gh release create/upload; nothing else in this job writes anywhere

      steps:
         - name: Check out the repository
           uses: actions/checkout@v7

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version: ${{ env.NODE_VERSION }}
              cache: npm

         - name: Install dependencies
           run: npm ci

         # No VITE_SITE_URL override: the default IS https://datajournal.org, so canonical, hreflang and
         # og:url point at the copy this job publishes. (The Pages job below overrides it for its mirror.)
         - name: Build the site for datajournal.org
           run: npm run build

         # The tar parser on the server reads the classic ustar name field only — longer paths truncate
         # silently and 404. Guarded here as well as in the spec, so a failure names the file.
         - name: Guard the archive constraints
           run: |
              long=$(find build -type f | sed 's|^build/||' | awk 'length($0) > 95')
              if [ -n "$long" ]; then echo "::error::paths exceed the ustar limit:"; echo "$long"; exit 1; fi
              for f in index.html meta.json og.jpg; do
                test -f "build/$f" || { echo "::error::build/$f missing from the archive root"; exit 1; }
              done

         # An explicit file list instead of --exclude='.*': GNU tar's unanchored exclude matches the
         # leading `.` component of EVERY member under `-C build .`, which once shipped a perfectly
         # valid, perfectly empty 22-byte archive. `find` names exactly the regular, non-hidden files —
         # no pattern semantics to differ between tar flavours.
         - name: Pack the release archive
           run: |
              (cd build && find . -type f ! -name '.*' ! -path '*/.*' | LC_ALL=C sort | tar -cf - -T -) | zstd -9 > release.tar.zst

         # Trust nothing that has not been read back: decompress the actual artifact and assert it holds
         # the site. The empty-archive failure above passed every earlier check because nothing looked at
         # the tar itself.
         - name: Verify the release archive
           run: |
              listing=$(zstd -dc release.tar.zst | tar -tf -)
              count=$(echo "$listing" | wc -l)
              echo "$count entries"
              for f in ./index.html ./meta.json ./og.jpg; do
                echo "$listing" | grep -qx "$f" || { echo "::error::$f missing from the archive"; exit 1; }
              done
              [ "$count" -gt 20 ] || { echo "::error::archive suspiciously small ($count entries)"; exit 1; }
              hidden=$(echo "$listing" | grep -E '(^|/)\.[^/]' || true)
              [ -z "$hidden" ] || { echo "::error::hidden files in the archive:"; echo "$hidden"; exit 1; }

         - name: Release
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              gh release create "release" --title "Release" --latest || true
              gh release upload "release" --clobber release.tar.zst

         - name: Deploy
           env:
              WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
           run: |
              if [ -z "$WEBHOOK_URL" ]; then
                echo "::warning::WEBHOOK_URL secret not set — release uploaded, but the server was not pinged (it will pick it up on its next restart)."
                exit 0
              fi
              curl -fsS "${WEBHOOK_URL}/update_pages"

   build:
      name: Build the static site (GitHub Pages mirror)
      needs: [checks, e2e]
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      runs-on: ubuntu-latest
      timeout-minutes: 15

      steps:
         - name: Check out the repository
           uses: actions/checkout@v7

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version: ${{ env.NODE_VERSION }}
              cache: npm

         - name: Install dependencies
           run: npm ci

         # The MIRROR: canonical, hreflang and og:url are absolute, so this copy has to advertise its
         # own host — without the override it would tell crawlers the real copy is the primary
         # (datajournal.org), which is true but makes the mirror useless as a standalone fallback.
         # `paths.base` is '/eclipse-2026' and must match the repository name for a project Pages site.
         - name: Prerender the site with absolute URLs
           run: npm run build
           env:
              VITE_SITE_URL: ${{ format('https://{0}.github.io', github.repository_owner) }}

         - name: Configure GitHub Pages
           uses: actions/configure-pages@v6

         - name: Upload the site as a Pages artifact
           uses: actions/upload-pages-artifact@v5
           with:
              path: build

   deploy:
      name: Deploy to GitHub Pages
      needs: build
      runs-on: ubuntu-latest
      timeout-minutes: 10
      environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}
      steps:
         - name: Publish to GitHub Pages
           id: deployment
           uses: actions/deploy-pages@v5
