name: CI

on:
   push:
      branches: [main]
   pull_request:
   workflow_dispatch:

# Pages deployment needs these; nothing else in the workflow writes to the repo.
permissions:
   contents: read
   pages: write
   id-token: write

# A newer push supersedes an in-flight run, but never cancel a deployment half-way.
concurrency:
   group: ci-${{ github.ref }}
   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
   NODE_VERSION: '24'

jobs:
   # The whole end-to-end suite runs on every push and pull request, split by COST rather than by test
   # count. Playwright's own --shard divides by number of tests, which lumps all the WebGL specs into one
   # shard: measured 192s / 81s / 27s / 18s across four, so four runners bought only 1.7x. Without a GPU
   # those 47 specs rasterise B3's terrain scene on the CPU and dominate everything else.
   #
   # Splitting them out gives three jobs — ~59s / ~143s / ~151s in a local simulation of a GPU-less
   # runner — so wall-clock is the slowest job rather than the sum. If the macOS legs below turn out to
   # have a real GPU, the WebGL work collapses and `rest` becomes the long pole; rebalance then.
   test:
      runs-on: ${{ matrix.os }}
      timeout-minutes: 45
      strategy:
         fail-fast: false
         matrix:
            include:
               # The non-WebGL leg has no GPU work at all, so the cheaper Linux runner is right for it.
               - name: rest
                 os: ubuntu-latest
                 shard: --grep-invert @webgl
                 browsers: chromium webkit
               # The WebGL legs go to macOS. On the Ubuntu runner B3's terrain scene is rasterised by
               # SwiftShader on two cores and did not reach `idle` inside 60 s; Apple Silicon runners are
               # faster per core and may expose Metal, which locally was the difference between ~20 s and
               # ~1.4 s. The renderer step below records which of the two we are actually getting.
               - name: webgl-1
                 os: macos-latest
                 shard: --grep @webgl --shard=1/2
                 browsers: chromium
               - name: webgl-2
                 os: macos-latest
                 shard: --grep @webgl --shard=2/2
                 browsers: chromium

      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: ${{ env.NODE_VERSION }}
              cache: npm # caches ~/.npm keyed on package-lock.json

         - run: npm ci

         - run: npm run sync

         # The map tiles. One located page load pulls ~66 objects from tiles.versatiles.org; across the
         # suite that is thousands of requests for the same handful of tiles. Restoring this keeps the run
         # fast and keeps us from hammering a free community service on every push.
         #
         # The key is unique per run so it never hits, and restore-keys falls back to the most recent
         # cache — the standard "always restore the latest, always save an updated copy" pattern. New
         # tiles a run happens to need are fetched once and folded in, rather than the cache freezing.
         - name: Cache map tiles
           uses: actions/cache@v4
           with:
              path: .cache/tiles
              key: tiles-${{ runner.os }}-${{ matrix.name }}-${{ github.run_id }}
              restore-keys: |
                 tiles-${{ runner.os }}-${{ matrix.name }}-

         # corridor.generated.ts is git-ignored and written by `prebuild`, so a fresh clone has no such
         # file — and the type checks below run before anything builds.
         - run: npm run corridor

         # Shard-independent, so run them once rather than three times over.
         - if: matrix.name == 'rest'
           run: npm run check:format
         - if: matrix.name == 'rest'
           run: npm run check:ts
         - if: matrix.name == 'rest'
           run: npm run lint
         - if: matrix.name == 'rest'
           run: npm run check:svelte
         - if: matrix.name == 'rest'
           run: npm run test:unit

         # Browsers are ~400 MB and unchanged between runs; key on the Playwright version so a bump
         # invalidates it. The WebGL shards only run the chromium project, so they skip WebKit entirely.
         - name: Resolve the Playwright version
           id: pw
           run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

         - uses: actions/cache@v4
           with:
              # Playwright stores browsers under ~/Library/Caches on macOS and ~/.cache on Linux.
              path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
              key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.name }}

         # `--with-deps` still runs on a cache hit — on Linux the system libraries live outside the cached
         # directory. It is a no-op on macOS.
         - name: Install browsers
           run: npx playwright install --with-deps ${{ matrix.browsers }}

         # Which renderer Chromium actually gets here. Metal means the GPU is available; SwiftShader means
         # we are paying for macOS and rasterising on the CPU anyway, and the legs should move back.
         - name: Report the WebGL renderer
           if: matrix.name != 'rest'
           run: |
              cat > tests/renderer-report.spec.ts <<'EOF'
              import { test } from './fixtures';
              test('renderer @webgl', async ({ page }) => {
                await page.goto('about:blank');
                const renderer = await page.evaluate(() => {
                  const gl = document.createElement('canvas').getContext('webgl2');
                  if (!gl) return 'NO WEBGL';
                  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                  return dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) : 'no debug ext';
                });
                console.log(`::notice title=WebGL on ${process.env.RUNNER_OS}::${renderer}`);
              });
              EOF
              npx playwright test tests/renderer-report.spec.ts --project chromium --reporter=list
              rm -f tests/renderer-report.spec.ts

         - name: End-to-end tests
           run: npx playwright test ${{ matrix.shard }}
           env:
              CI: true

         - uses: actions/upload-artifact@v4
           if: ${{ !cancelled() }}
           with:
              name: playwright-report-${{ matrix.name }}
              path: playwright-report/
              retention-days: 7

   build:
      needs: test
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      runs-on: ubuntu-latest
      timeout-minutes: 15

      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
              node-version: ${{ env.NODE_VERSION }}
              cache: npm
         - run: npm ci

         # Every canonical, hreflang and og:url is absolute, so the build has to know where it will live.
         # Without this the deployed pages would tell crawlers the real copy is on another host entirely.
         # `paths.base` is '/eclipse-2026' and must match the repository name for a project Pages site.
         - name: Build
           run: npm run build
           env:
              VITE_SITE_URL: ${{ format('https://{0}.github.io', github.repository_owner) }}

         - uses: actions/configure-pages@v5
         - uses: actions/upload-pages-artifact@v3
           with:
              path: build

   deploy:
      needs: build
      runs-on: ubuntu-latest
      timeout-minutes: 10
      environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}
      steps:
         - id: deployment
           uses: actions/deploy-pages@v4
